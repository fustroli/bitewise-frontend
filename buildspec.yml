version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g bun@1.4.3
      - bun install --frozen-lockfile
  build:
    commands:
      # Server-only runtime config; `next start` reads it on the instance.
      - echo "COOKIE_DOMAIN=${COOKIE_DOMAIN}" > .env.production
      - bun run build

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - .next/**/*
    - public/**/*
    - package.json
    - bun.lock
    - next.config.mjs
    - .env.production
