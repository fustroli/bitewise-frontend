version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm ci
  build:
    commands:
      # Server-only runtime config; `next start` reads it on the instance.
      - echo "COOKIE_DOMAIN=${COOKIE_DOMAIN}" > .env.production
      - npm run build

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - .next/**/*
    - public/**/*
    - package.json
    - package-lock.json
    - next.config.mjs
    - .env.production
