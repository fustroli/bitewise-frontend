version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install
  build:
    commands:
      - npm run build

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - .next/**/*
    - public/**/*
    - package.json
    - package-lock.json
    - next.config.mjs
